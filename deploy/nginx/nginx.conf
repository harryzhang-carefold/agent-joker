# agent-joker WebConsole — Nginx 托管静态资源 + 反代（ARCH §5.1/§5.2）
#
# 职责（S10 前端 + S11 集成复用）：
#   1. 托管 WebConsole 构建产物（frontend/dist，SPA fallback 到 index.html）
#   2. 反向代理 /api /v1 /mcp → bff:8000（S08 统一网关）
#   3. SSE（agent 对话流式）+ 长文档上传/下载 的代理调优
#
# 镜像：nginx:1.27-alpine（ARCH §5.2）
# 端口：容器 80，compose 发布 8080（ARCH §5.2：宿主机 8080 → 容器 80）

server {
    listen 80;
    server_name _;

    # 上游 IP 动态解析（BUG 修复：compose 重建 bff 后 nginx 仍缓存旧 IP → 502。
    # Docker 内置 DNS 127.0.0.11 + 短超时，每次请求重新解析 bff:8000）
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 上传体积上限（文档/图片上传，S04）；与 BFF 代理超时配合
    client_max_body_size 64m;

    # ---------- 静态资源（WebConsole SPA） ----------
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由 fallback：非接口路径一律回 index.html（前端 vue-router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---------- 反向代理 → BFF 统一网关（S08） ----------
    # /api  = 9 模块 REST（经 BFF 内部 HMAC 签名转发到 PlatformAPI）
    # /v1   = OpenAI 兼容（agent 对话，块式 + SSE 流式）
    # /mcp  = 平台 MCP 三工具对外（Streamable HTTP）
    location ~ ^/(api|v1|mcp)(/|$) {
        proxy_pass http://bff:8000;
        proxy_http_version 1.1;

        # SSE / 流式（agent 对话 stream=true）：关闭缓冲，长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 透传身份/连接头（BFF 只信 Authorization，不信任 body）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket 升级（MCP Streamable HTTP 可能用到）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # 健康检查（不经反代，供 compose healthcheck）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
