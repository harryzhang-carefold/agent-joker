# agent-joker WebConsole — Nginx 托管静态资源 + 反代（ARCH §5.1/§5.2）
#
# 职责（S10 前端 + S11 集成复用）：
#   1. 托管 WebConsole 构建产物（frontend/dist，SPA fallback 到 index.html）
#   2. 反向代理 /api /v1 /mcp → bff:8000（S08 统一网关）
#   3. SSE（agent 对话流式）+ 长文档上传/下载 的代理调优
#
# 镜像：nginx:1.27-alpine（ARCH §5.2）
# 端口：容器 80，compose 发布 8080（ARCH §5.2：宿主机 8080 → 容器 80）

server {
    listen 80;
    server_name _;

    # 上游 IP 动态解析（BUG 修复：compose 重建 bff 后 nginx 仍缓存旧 IP → 502。
    # Docker 内置 DNS 127.0.0.11 + 短超时，每次请求重新解析 bff:8000）
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 上传体积上限（文档/图片上传，S04）；与 BFF 代理超时配合
    client_max_body_size 64m;

    # ---------- 静态资源（WebConsole SPA） ----------
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由 fallback：非接口路径一律回 index.html（前端 vue-router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ---------- 反向代理 → BFF 统一网关（S08） ----------
    # /api  = 9 模块 REST（经 BFF 内部 HMAC 签名转发到 PlatformAPI）
    # /v1   = OpenAI 兼容（agent 对话，块式 + SSE 流式）
    #
    # BUG-10 修复（S23）：正则从 ^/(api|v1|mcp)(/|$) 收窄为 ^/(api|v1)(/|$)。
    # 原正则把前端 SPA 路由 /mcp/*（MCP Server 管理页）也代理给了 BFF →
    # 浏览器直连/刷新/分享 http://host:8080/mcp/servers 命中 BFF 401 JSON，SPA 不渲染。
    # BFF 的 MCP REST 实际都在 /api/mcp 下（前端 api/mcp.js），而 /mcp 是前端 vue-router
    # 的 SPA 路由，不应进 BFF。BFF 平台 MCP Streamable 端点（/mcp，仅 docker 网络内
    # bff:8000/mcp 访问）不经 webconsole 反代，故此处移除 /mcp 分支。
    location ~ ^/(api|v1)(/|$) {
        # BUG-15 修复（S26）：proxy_pass 用【变量】上游。nginx 对 proxy_pass 里的
        # “字面量”主机名只在配置加载（容器启动）时解析一次，之后不再重解析——
        # resolver 指令只对【变量】主机名生效。因此 S23 的 “resolver + bff:8000”
        # 修复无效：compose 重建 bff 后 IP 变化，nginx 仍缓存旧 IP → 502（本轮 S26
        # 全模块自测发现，webconsole 日志 connect() failed 111 铁证）。
        # 用 set 变量 → 每次请求经 resolver(127.0.0.11, valid=10s) 重新解析 bff。
        set $bff_upstream bff;
        proxy_pass http://$bff_upstream:8000;
        proxy_http_version 1.1;

        # SSE / 流式（agent 对话 stream=true）：关闭缓冲，长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 透传身份/连接头（BFF 只信 Authorization，不信任 body）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket 升级（MCP Streamable HTTP 可能用到）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # 健康检查（不经反代，供 compose healthcheck）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
